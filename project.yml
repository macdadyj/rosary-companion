name: Rosary
options:
  bundleIdPrefix: com.lojo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  postGenCommand: python3 scripts/patch-watch-embed.py
packages:
  RosaryCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  # RosaryApp, not Rosary: Package.swift already has a target named Rosary. When both
  # exist, xcodebuild resolves the UI-test host to the package product at
  # Debug-iphonesimulator/Rosary and exits 65 because that path has no bundle id.
  # productName keeps the installed app as Rosary.app.
  RosaryApp:
    type: application
    platform: iOS
    productName: Rosary
    sources:
      - path: Sources/Rosary
      - path: Config/Assets.xcassets
    dependencies:
      - package: RosaryCore
        product: RosaryCore
      - target: RosaryWidget
        embed: true
      - target: RosaryWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.Rosary
        DEVELOPMENT_TEAM: N9H4648NB9
        PRODUCT_NAME: Rosary
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
  RosaryWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/RosaryWidget
    dependencies:
      - package: RosaryCore
        product: RosaryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.Rosary.widget
        DEVELOPMENT_TEAM: N9H4648NB9
        PRODUCT_NAME: RosaryWidget
        INFOPLIST_FILE: Config/WidgetInfo.plist
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: YES
  RosaryWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/RosaryWatch
      - path: Config/WatchAssets.xcassets
    dependencies:
      - package: RosaryCore
        product: RosaryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.Rosary.watchkitapp
        DEVELOPMENT_TEAM: N9H4648NB9
        PRODUCT_NAME: RosaryWatch
        INFOPLIST_FILE: Config/WatchInfo.plist
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RosaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RosaryApp
      - package: RosaryCore
        product: RosaryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.Rosary.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RosaryApp
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  RosaryWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    dependencies:
      - target: RosaryWatch
      - package: RosaryCore
        product: RosaryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.Rosary.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RosaryWatch
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
schemes:
  Rosary:
    build:
      targets:
        RosaryApp: all
        RosaryWidget: all
        RosaryWatch: all
    run:
      config: Debug
      executable: RosaryApp
    test:
      config: Debug
      targets:
        - RosaryUITests
    archive:
      config: Release
      customArchiveName: Rosary
  RosaryWatch:
    build:
      targets:
        RosaryWatch: all
        RosaryWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RosaryWatchUITests
  RosaryUI:
    build:
      targets:
        RosaryApp: all
        RosaryUITests: [test]
    run:
      config: Debug
      executable: RosaryApp
    test:
      config: Debug
      targets:
        - RosaryUITests
